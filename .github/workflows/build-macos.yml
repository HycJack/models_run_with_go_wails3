name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.0.0-beta.14"
  GOSUMDB: "off"

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Verify build tools
        shell: bash
        run: |
          go env CGO_ENABLED CC
          xcode-select -p

      - name: Build universal binary (arm64 + amd64)
        shell: bash
        run: wails3 task darwin:build:universal

      - name: Package .app bundle
        shell: bash
        run: |
          # Skip `darwin:package` (it re-runs `build` which conflicts with the
          # universal binary already at bin/cpm-orc).  Call the lower-level
          # tasks directly: create the .app directory then ad-hoc sign it.
          wails3 task darwin:create:app:bundle
          wails3 task darwin:codesign:adhoc

      - name: Create DMG installer (best effort)
        shell: bash
        run: |
          wails3 task darwin:create:dmg || echo "::warning::DMG creation failed; the .app bundle will still be uploaded"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpm-orc-macos
          path: |
            bin/cpm-orc.app
            bin/cpm-orc.dmg
          if-no-files-found: error

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/cpm-orc.app
            bin/cpm-orc.dmg
          fail_on_unmatched_files: false
          draft: true
